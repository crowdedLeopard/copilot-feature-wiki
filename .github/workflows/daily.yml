name: Daily curation and deploy

on:
  schedule:
    - cron: '0 6 * * *' # 06:00 UTC every day
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      compile_limit:
        description: 'Maximum briefings to write or refresh in this run'
        required: false
        default: '12'
      compile_only:
        description: 'Comma-separated roadmap IDs to (re)compile, overriding the queue'
        required: false
        default: ''
      compile_model:
        description: 'Model override for the compile step (leave empty for the default)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

# One run at a time: the curation step commits back to main.
concurrency:
  group: release-ledger
  cancel-in-progress: false

jobs:
  curate-and-build:
    name: Curate, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 150
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Site URL from the repository name
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "SITE_URL=https://${owner}.github.io" >> "$GITHUB_ENV"
          echo "SITE_BASE=/${{ github.event.repository.name }}" >> "$GITHUB_ENV"

      - name: Ingest the Microsoft 365 Roadmap
        run: node pipeline/ingest.mjs

      # ---- Compile: the one step that needs Claude. Two ways to pay for it, in order of preference:
      #   1. CLAUDE_CODE_OAUTH_TOKEN  (Claude Pro/Max subscription; from `claude setup-token`)
      #   2. ANTHROPIC_API_KEY        (pay-as-you-go API)
      # With neither secret the step is skipped and the site still rebuilds from committed pages.
      # Pushes to main only rebuild; the scheduled and manual runs do the writing.
      - name: Decide how to compile
        id: auth
        if: github.event_name != 'push'
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$OAUTH" ]; then
            echo "mode=claude-code" >> "$GITHUB_OUTPUT"
          elif [ -n "$KEY" ]; then
            echo "mode=api" >> "$GITHUB_OUTPUT"
          else
            echo "mode=none" >> "$GITHUB_OUTPUT"
            echo "compile: skipped. Add a CLAUDE_CODE_OAUTH_TOKEN (Claude subscription) or ANTHROPIC_API_KEY repository secret to enable daily curation." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Prepare compile tasks
        id: tasks
        if: steps.auth.outputs.mode == 'claude-code'
        env:
          COMPILE_LIMIT: ${{ github.event.inputs.compile_limit || '12' }}
          COMPILE_ONLY: ${{ github.event.inputs.compile_only || '' }}
        run: node pipeline/compile-tasks.mjs

      - name: Compile briefings with Claude Code (subscription)
        if: steps.auth.outputs.mode == 'claude-code' && steps.tasks.outputs.count != '0'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Read pipeline/prompts/compile-agent.md and carry out the run it describes.
            The task list for this run is in data/compile-tasks.json.
          claude_args: >-
            --max-turns 400
            --mcp-config pipeline/mcp.json
            --allowedTools "Read,Glob,Grep,Write,Edit,WebSearch,WebFetch(domain:learn.microsoft.com),WebFetch(domain:techcommunity.microsoft.com),WebFetch(domain:adoption.microsoft.com),WebFetch(domain:www.microsoft.com),Bash(node pipeline/write-briefing.mjs:*),Bash(node pipeline/lint.mjs),Bash(cat:*),Bash(ls:*),mcp__microsoft-learn"
            ${{ github.event.inputs.compile_model != '' && format('--model {0}', github.event.inputs.compile_model) || '' }}

      - name: Record the compile run
        if: always() && steps.auth.outputs.mode == 'claude-code' && steps.tasks.outputs.count != '0'
        env:
          COMPILE_MODEL: ${{ github.event.inputs.compile_model || '' }}
        run: node pipeline/compile-finish.mjs

      - name: Compile briefings with the API key
        if: steps.auth.outputs.mode == 'api'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COMPILE_LIMIT: ${{ github.event.inputs.compile_limit || '12' }}
          COMPILE_ONLY: ${{ github.event.inputs.compile_only || '' }}
          COMPILE_MODEL: ${{ github.event.inputs.compile_model || 'claude-opus-5-5' }}
        run: node pipeline/compile.mjs

      - name: Lint the wiki
        run: node pipeline/lint.mjs

      - name: Rebuild index and weekly digest
        run: |
          node pipeline/index.mjs
          node pipeline/digest.mjs

      - name: Commit curated changes
        id: commit
        # Pushes to main only rebuild the site; the scheduled and manual runs own the curation commits.
        if: github.event_name != 'push'
        run: |
          git config user.name "release-ledger[bot]"
          git config user.email "release-ledger[bot]@users.noreply.github.com"
          git add raw data wiki
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to commit."
          else
            git commit -m "chore(curation): daily run $(date -u +%Y-%m-%d)" -m "Roadmap ingest, briefings, lint report, index and digest regenerated by the daily workflow."
            # If main moved while this run was working, keep this run's regenerated files.
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the site
        run: npm run build

      - name: Install Chromium for PDF rendering
        run: npx playwright install --with-deps chromium

      - name: Render briefing PDFs
        run: node pipeline/pdf.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: curate-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
