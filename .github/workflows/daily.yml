name: Daily curation and deploy

on:
  schedule:
    # Four runs a day. Each run writes COMPILE_LIMIT briefings shared across the five topics, so the
    # default is 4 x 24 = 96 a day. The minute is off the hour because GitHub delays runs queued at :00.
    - cron: '23 1,7,13,19 * * *'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      compile_limit:
        description: 'Maximum briefings to write or refresh in this run'
        required: false
        default: '24'
      compile_topic:
        description: 'Spend the whole run on one topic (copilot-studio, power-platform, governance, m365-copilot or modern-work). Empty shares the run across all five.'
        required: false
        default: ''
      compile_only:
        description: 'Comma-separated roadmap IDs to (re)compile, overriding the queue'
        required: false
        default: ''
      compile_writer:
        description: 'Which capacity writes: copilot (GitHub Copilot seat, default), claude-code (Claude subscription), api (Anthropic API key) or none'
        required: false
        default: ''
      compile_model:
        description: 'Model override for the compile step (leave empty for the default)'
        required: false
        default: ''
      verify_limit:
        description: 'Maximum briefings the independent check re-verifies in this run, on top of everything written today'
        required: false
        default: ''
      verify_only:
        description: 'Comma-separated briefing slugs to verify, or "all" (overrides the queue)'
        required: false
        default: ''
      verify_model:
        description: 'Model override for the verifier (leave empty for the default)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write
  copilot-requests: write # lets the job's token make Copilot requests, billed to the repository owner's seat

# Curation runs (scheduled and manual) go one at a time because they commit back to main. A push to
# main only rebuilds the site, so it has its own lane: GitHub keeps one pending run per group, and a
# push that joined the curation lane cancelled a waiting curation run (16 Nov 2026). The curation
# run's commit step rebases onto whatever a concurrent push merged, and the deploy job has its own
# group so Pages deployments still happen one at a time.
concurrency:
  group: release-ledger-${{ github.event_name == 'push' && 'rebuild' || 'curate' }}
  cancel-in-progress: false

jobs:
  curate-and-build:
    name: Curate, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 150
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      # 'true' only when the Copilot writer has failed on two runs in a row (compile-copilot.mjs keeps count).
      writer_escalate: ${{ steps.copilot.outputs.escalate }}
      verifier_failed: ${{ steps.verify.outcome == 'failure' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Site URL from the repository name
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "SITE_URL=https://${owner}.github.io" >> "$GITHUB_ENV"
          echo "SITE_BASE=/${{ github.event.repository.name }}" >> "$GITHUB_ENV"

      # Message Center has no public feed, so the ledger reads one tenant's posts through Microsoft Graph with a
      # read-only app permission (ServiceMessage.Read.All) and publishes only the text Microsoft sends to every
      # tenant; see docs/message-centre.md for the one-off setup. With no MC_TENANT_ID / MC_CLIENT_ID the step
      # says so and the run carries on without posts. Sign-in is the workflow's own OIDC token (a federated
      # credential on the app registration) unless an MC_CLIENT_SECRET is set.
      - name: Ingest Message Centre posts
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          MC_TENANT_ID: ${{ secrets.MC_TENANT_ID || vars.MC_TENANT_ID }}
          MC_CLIENT_ID: ${{ secrets.MC_CLIENT_ID || vars.MC_CLIENT_ID }}
          MC_CLIENT_SECRET: ${{ secrets.MC_CLIENT_SECRET }}
          MC_TENANT_WORDS: ${{ vars.MC_TENANT_WORDS }}
        run: node pipeline/ingest-message-center.mjs

      - name: Ingest the Microsoft 365 Roadmap
        run: node pipeline/ingest.mjs

      # Briefings the verifier held, and live pages it found wanting, go to the front of today's writing queue so
      # the writer corrects them (with the verifier's findings in hand) before it starts anything new.
      - name: Queue held briefings for revision
        if: github.event_name != 'push'
        run: node pipeline/requeue-held.mjs

      # ---- Compile: the one step that needs an LLM. Three writers, chosen by the COMPILE_WRITER
      # repository variable (or the compile_writer input for one run):
      #   copilot      GitHub Copilot CLI on the repository owner's Copilot seat (default; no secret needed,
      #                or a COPILOT_GITHUB_TOKEN fine-grained PAT with "Copilot Requests" to bill a specific user)
      #   claude-code  Claude Code action on a Claude subscription (CLAUDE_CODE_OAUTH_TOKEN secret)
      #   api          the Anthropic API (ANTHROPIC_API_KEY secret)
      #   none         skip writing; the site still rebuilds from committed pages
      # Pushes to main only rebuild; the scheduled and manual runs do the writing.
      - name: Decide how to compile
        id: auth
        if: github.event_name != 'push'
        env:
          WRITER: ${{ github.event.inputs.compile_writer || vars.COMPILE_WRITER || 'copilot' }}
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          case "$WRITER" in
            copilot) mode=copilot ;;
            claude-code)
              if [ -n "$OAUTH" ]; then mode=claude-code; else mode=none; echo "compile: skipped. COMPILE_WRITER is claude-code but there is no CLAUDE_CODE_OAUTH_TOKEN secret." >> "$GITHUB_STEP_SUMMARY"; fi ;;
            api)
              if [ -n "$KEY" ]; then mode=api; else mode=none; echo "compile: skipped. COMPILE_WRITER is api but there is no ANTHROPIC_API_KEY secret." >> "$GITHUB_STEP_SUMMARY"; fi ;;
            none|off) mode=none; echo "compile: skipped (COMPILE_WRITER=$WRITER)." >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo "::error::Unknown compile writer '$WRITER' (use copilot, claude-code, api or none)"; exit 1 ;;
          esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "compile writer: $mode"

      - name: Prepare compile tasks
        id: tasks
        if: steps.auth.outputs.mode == 'copilot' || steps.auth.outputs.mode == 'claude-code'
        env:
          COMPILE_LIMIT: ${{ github.event.inputs.compile_limit || '24' }}
          COMPILE_TOPIC: ${{ github.event.inputs.compile_topic || '' }}
          COMPILE_ONLY: ${{ github.event.inputs.compile_only || '' }}
        run: node pipeline/compile-tasks.mjs

      - name: Install Copilot CLI
        if: steps.auth.outputs.mode == 'copilot' && steps.tasks.outputs.count != '0'
        run: |
          npm install -g @github/copilot
          copilot --version

      # Billed in AI credits to the Copilot seat of the repository owner (GITHUB_TOKEN) or of the user who
      # made the COPILOT_GITHUB_TOKEN PAT. Caps: COMPILE_ITEM_MAX_CREDITS per briefing, COMPILE_MAX_CREDITS per run.
      # The step checks the token and model first (falling back through COPILOT_FALLBACK_MODELS), retries a
      # session that fails fast, and explains any failure in plain English in the run summary. It never fails
      # the job: the rest of the run (lint, build, deploy) carries on with what is committed.
      - name: Compile briefings with Copilot CLI (GitHub Copilot seat)
        id: copilot
        if: steps.auth.outputs.mode == 'copilot' && steps.tasks.outputs.count != '0'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_PAT: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          COPILOT_MODEL: ${{ github.event.inputs.compile_model || vars.COPILOT_MODEL || 'claude-opus-5.5' }}
          COPILOT_FALLBACK_MODELS: ${{ vars.COPILOT_FALLBACK_MODELS || 'claude-sonnet-5.5,auto' }}
          COPILOT_REASONING_EFFORT: ${{ vars.COPILOT_REASONING_EFFORT || 'high' }}
          COMPILE_PARALLEL: ${{ vars.COMPILE_PARALLEL || '2' }}
          COMPILE_ITEM_MAX_CREDITS: ${{ vars.COMPILE_ITEM_MAX_CREDITS || '300' }}
          COMPILE_MAX_CREDITS: ${{ vars.COMPILE_MAX_CREDITS || '' }}
        run: |
          if [ -n "$COPILOT_PAT" ]; then export COPILOT_GITHUB_TOKEN="$COPILOT_PAT"; fi
          unset COPILOT_PAT
          node pipeline/compile-copilot.mjs

      - name: Keep the Copilot session transcripts and usage
        if: always() && steps.auth.outputs.mode == 'copilot' && steps.tasks.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: copilot-sessions-${{ github.run_id }}
          path: |
            data/compile-tasks/*.session.md
            data/compile-tasks/*.usage.json
            data/compile-tasks/*.output.json
            data/compile-usage.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Compile briefings with Claude Code (subscription)
        if: steps.auth.outputs.mode == 'claude-code' && steps.tasks.outputs.count != '0'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Read pipeline/prompts/compile-agent.md and carry out the run it describes.
            The task list for this run is in data/compile-tasks.json.
          claude_args: >-
            --max-turns ${{ steps.tasks.outputs.turns || '400' }}
            --mcp-config pipeline/mcp.json
            --allowedTools "Read,Glob,Grep,Write,Edit,WebSearch,WebFetch(domain:learn.microsoft.com),WebFetch(domain:techcommunity.microsoft.com),WebFetch(domain:adoption.microsoft.com),WebFetch(domain:www.microsoft.com),Bash(node pipeline/write-briefing.mjs:*),Bash(node pipeline/lint.mjs),Bash(cat:*),Bash(ls:*),mcp__microsoft-learn"
            ${{ github.event.inputs.compile_model != '' && format('--model {0}', github.event.inputs.compile_model) || '' }}

      - name: Record the compile run
        if: always() && (steps.auth.outputs.mode == 'copilot' || steps.auth.outputs.mode == 'claude-code') && steps.tasks.outputs.count != '0'
        env:
          COMPILE_PATH: ${{ steps.auth.outputs.mode }}
          COMPILE_MODEL: ${{ steps.copilot.outputs.model || github.event.inputs.compile_model || '' }}
        run: node pipeline/compile-finish.mjs

      - name: Compile briefings with the API key
        if: steps.auth.outputs.mode == 'api'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COMPILE_LIMIT: ${{ github.event.inputs.compile_limit || '24' }}
          COMPILE_TOPIC: ${{ github.event.inputs.compile_topic || '' }}
          COMPILE_ONLY: ${{ github.event.inputs.compile_only || '' }}
          COMPILE_MODEL: ${{ github.event.inputs.compile_model || 'claude-opus-5-5' }}
        run: node pipeline/compile.mjs

      # ---- Verify: a second model, in a fresh session, checks every briefing written or refreshed today, and a
      # slice of the back catalogue, claim by claim against the roadmap record and Microsoft Learn
      # (pipeline/prompts/verify-agent.md). A page with a contradicted or unsupported path, command, licence, price,
      # date or default is held in wiki/_held and not published; the next run's writer gets its findings. Pages
      # published before the check existed stay live with a notice on their first failure (VERIFY_GRACE_EXISTING=0
      # holds them too). Runs on the same Copilot seat by default; VERIFY_ENGINE = copilot | claude-code | api | off.
      - name: Prepare verification tasks
        id: verify_tasks
        if: github.event_name != 'push' && (vars.VERIFY_ENGINE || 'copilot') != 'off'
        env:
          VERIFY_LIMIT: ${{ github.event.inputs.verify_limit || vars.VERIFY_LIMIT || '24' }}
          VERIFY_ONLY: ${{ github.event.inputs.verify_only || '' }}
        run: node pipeline/verify-tasks.mjs

      - name: Install the verifier's CLI
        if: steps.verify_tasks.outputs.count != '0'
        env:
          VERIFY_ENGINE: ${{ vars.VERIFY_ENGINE || 'copilot' }}
        run: |
          case "$VERIFY_ENGINE" in
            copilot) command -v copilot >/dev/null || npm install -g @github/copilot; copilot --version ;;
            claude-code) command -v claude >/dev/null || npm install -g @anthropic-ai/claude-code; claude --version ;;
          esac

      - name: Verify briefings against Microsoft Learn
        id: verify
        if: steps.verify_tasks.outputs.count != '0'
        continue-on-error: true
        env:
          VERIFY_ENGINE: ${{ vars.VERIFY_ENGINE || 'copilot' }}
          VERIFY_MODEL: ${{ github.event.inputs.verify_model || vars.VERIFY_MODEL || '' }}
          VERIFY_FALLBACK_MODELS: ${{ vars.VERIFY_FALLBACK_MODELS || '' }}
          VERIFY_MAX_CREDITS: ${{ vars.VERIFY_MAX_CREDITS || '250' }}
          VERIFY_MAX_RUN_CREDITS: ${{ vars.VERIFY_MAX_RUN_CREDITS || '' }}
          VERIFY_TIMEOUT_MINUTES: ${{ vars.VERIFY_TIMEOUT_MINUTES || '15' }}
          VERIFY_RUN_MINUTES: ${{ vars.VERIFY_RUN_MINUTES || '60' }}
          VERIFY_GRACE_EXISTING: ${{ vars.VERIFY_GRACE_EXISTING || '1' }}
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_PAT: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$COPILOT_PAT" ]; then export COPILOT_GITHUB_TOKEN="$COPILOT_PAT"; fi
          unset COPILOT_PAT
          node pipeline/verify-run.mjs

      - name: Keep the verifier transcripts and verdicts
        if: always() && steps.verify_tasks.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: verify-sessions-${{ github.run_id }}
          path: |
            data/verify-tasks/
            data/verify-tasks.json
            data/verify-results.json
            data/verify-run.json
          if-no-files-found: ignore
          retention-days: 14

      # Holds anything written today that the verifier did not get to, writes data/held.json, logs the run.
      - name: Record the verification run
        if: always() && steps.verify_tasks.outputs.count != '0'
        env:
          VERIFY_ENGINE: ${{ vars.VERIFY_ENGINE || 'copilot' }}
          VERIFY_GRACE_EXISTING: ${{ vars.VERIFY_GRACE_EXISTING || '1' }}
        run: node pipeline/verify-finish.mjs

      - name: Lint the wiki
        run: node pipeline/lint.mjs

      - name: Rebuild index and weekly digest
        run: |
          node pipeline/index.mjs
          node pipeline/digest.mjs

      - name: Commit curated changes
        id: commit
        # Pushes to main only rebuild the site; the scheduled and manual runs own the curation commits.
        if: github.event_name != 'push'
        run: |
          git config user.name "release-ledger[bot]"
          git config user.email "release-ledger[bot]@users.noreply.github.com"
          git add raw data wiki
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to commit."
          else
            git commit -m "chore(curation): daily run $(date -u +%Y-%m-%d)" -m "Roadmap ingest, briefings, lint report, index and digest regenerated by the daily workflow."
            # If main moved while this run was working, keep this run's regenerated files.
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the site
        run: npm run build

      - name: Install Chromium for PDF rendering
        run: npx playwright install --with-deps chromium

      - name: Render briefing PDFs
        run: node pipeline/pdf.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: curate-and-build
    runs-on: ubuntu-latest
    concurrency:
      group: release-ledger-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      # The site is rebuilt and deployed even when the writer could not run. One failed writer run is a
      # warning in the run summary (Copilot can be busy, and the next run retries). Two in a row mark the
      # run failed so a broken writer shows up in the Actions list rather than silently writing nothing.
      - name: Flag a writer that has failed twice in a row
        if: needs.curate-and-build.outputs.writer_escalate == 'true'
        run: |
          echo "::error title=Copilot writer::No briefings were written on this run or the one before it. The site was still rebuilt and deployed. Open the 'Compile briefings with Copilot CLI' step of the 'Curate, lint, build' job for the reason in plain English."
          exit 1

      # Likewise for the verifier: today's new pages were held rather than published unchecked, and the run is marked.
      - name: Flag a failed verifier
        if: needs.curate-and-build.outputs.verifier_failed == 'true'
        run: |
          echo "::error::The verifier did not finish (see the 'Verify briefings against Microsoft Learn' step). Briefings it did not check were held, not published."
          exit 1
