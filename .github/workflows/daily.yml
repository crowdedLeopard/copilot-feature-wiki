name: Daily curation and deploy

on:
  schedule:
    - cron: '0 6 * * *' # 06:00 UTC every day
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      compile_limit:
        description: 'Maximum briefings to write or refresh in this run'
        required: false
        default: '12'
      compile_only:
        description: 'Comma-separated roadmap IDs to (re)compile, overriding the queue'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

# One run at a time: the curation step commits back to main.
concurrency:
  group: release-ledger
  cancel-in-progress: false

jobs:
  curate-and-build:
    name: Curate, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Site URL from the repository name
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "SITE_URL=https://${owner}.github.io" >> "$GITHUB_ENV"
          echo "SITE_BASE=/${{ github.event.repository.name }}" >> "$GITHUB_ENV"

      - name: Ingest the Microsoft 365 Roadmap
        run: node pipeline/ingest.mjs

      - name: Compile briefings
        # Skipped automatically when ANTHROPIC_API_KEY is not set as a repository secret.
        if: github.event_name != 'push'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COMPILE_LIMIT: ${{ github.event.inputs.compile_limit || '12' }}
          COMPILE_ONLY: ${{ github.event.inputs.compile_only || '' }}
        run: node pipeline/compile.mjs

      - name: Lint the wiki
        run: node pipeline/lint.mjs

      - name: Rebuild index and weekly digest
        run: |
          node pipeline/index.mjs
          node pipeline/digest.mjs

      - name: Commit curated changes
        id: commit
        run: |
          git config user.name "release-ledger[bot]"
          git config user.email "release-ledger[bot]@users.noreply.github.com"
          git add raw data wiki
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to commit."
          else
            git commit -m "chore(curation): daily run $(date -u +%Y-%m-%d)" -m "Roadmap ingest, briefings, lint report, index and digest regenerated by the daily workflow."
            git pull --rebase origin main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the site
        run: npm run build

      - name: Install Chromium for PDF rendering
        run: npx playwright install --with-deps chromium

      - name: Render briefing PDFs
        run: node pipeline/pdf.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: curate-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
